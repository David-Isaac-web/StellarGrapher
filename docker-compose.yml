# Local development stack for running Prism against a stellar-quickstart network.
#
# Usage:
#   docker compose up -d
#
# This starts a local Stellar network (stellar/quickstart) exposing the
# Horizon and Soroban RPC endpoints that Prism can be pointed at.
#
# Endpoints once healthy:
#   Horizon:      http://localhost:8000
#   Soroban RPC:  http://localhost:8000/soroban/rpc
#   Friendbot:    http://localhost:8000/friendbot
#   Network passphrase: "Standalone Network ; February 2017"
#
# Point Prism at the local network by setting (e.g. in .env.local):
#   NEXT_PUBLIC_STELLAR_NETWORK=standalone
#   NEXT_PUBLIC_HORIZON_URL=http://localhost:8000
#   NEXT_PUBLIC_SOROBAN_RPC_URL=http://localhost:8000/soroban/rpc
#   NEXT_PUBLIC_NETWORK_PASSPHRASE="Standalone Network ; February 2017"
#
# Deploy the showcase contract to this network with the Stellar CLI:
#   stellar contract deploy \
#     --wasm target/wasm32-unknown-unknown/release/showcase.wasm \
#     --source alice \
#     --network standalone \
#     --rpc-url http://localhost:8000/soroban/rpc \
#     --network-passphrase "Standalone Network ; February 2017"

services:
  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: prism-stellar-quickstart
    command: --local
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
